<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Popup Robustness Test</title>
    <style>
        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        #popup {
            background: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
        }
        #content {
            padding: 50px;
        }
    </style>
</head>
<body>
    <div id="overlay">
        <div id="popup">
            <h2>Cookie & Ads Warning</h2>
            <p>Do you accept everything?</p>
            <button id="close-popup" onclick="document.getElementById('overlay').style.display='none'">Accept and Close</button>
        </div>
    </div>

    <div id="content">
        <h1>Main Application Content</h1>
        <p>This button is hidden behind the popup initially.</p>
        <button id="target-btn" onclick="this.innerText='SUCCESS'">CLICK ME FOR SUCCESS</button>
    </div>
</body>
</html>
