name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies (Python 3.13, locked)
        run: uv sync --frozen --python 3.13

      # The suite mocks Playwright and the Gemini client: no browser, network or API key needed.
      - name: Run tests
        run: uv run python -m pytest -q
